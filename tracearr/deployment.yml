apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app: tracearr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tracearr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: tracearr
    spec:
      initContainers:
        - name: init-permissions
          image: busybox:1.37
          securityContext:
            runAsUser: 0
            privileged: false
          command:
            - sh
            - -c
            - |
              mkdir -p /pvc-root/postgres /pvc-root/redis /pvc-root/backups /pvc-root/image-cache
              chown -R 1000:1000 /pvc-root/postgres
              chown -R 999:999 /pvc-root/redis
              chown -R 1001:1001 /pvc-root/backups /pvc-root/image-cache
          volumeMounts:
            - name: data
              mountPath: /pvc-root

      containers:
        - name: tracearr
          image: ghcr.io/connorgallopo/tracearr:latest
          imagePullPolicy: Always
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          envFrom:
            - secretRef:
                name: tracearr-secret
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOST
              value: 0.0.0.0
            - name: TZ
              value: Asia/Chongqing
            - name: DATABASE_URL
              value: "postgres://tracearr:$(DB_PASSWORD)@localhost:5432/tracearr"
            - name: REDIS_URL
              value: "redis://localhost:6379"
            - name: CORS_ORIGIN
              value: "*"
            - name: LOG_LEVEL
              value: info
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data/backup
              subPath: backups
            - name: data
              mountPath: /app/data/image-cache
              subPath: image-cache

        - name: timescale
          image: timescale/timescaledb-ha:pg18.1-ts2.25.0
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          args:
            - postgres
            - -c
            - timescaledb.license=timescale
            - -c
            - timescaledb.max_tuples_decompressed_per_dml_transaction=0
            - -c
            - max_locks_per_transaction=4096
            - -c
            - timescaledb.telemetry_level=off
            # Memory tuning for local lab environments
            - -c
            - shared_buffers=128MB
            - -c
            - work_mem=16MB
            - -c
            - maintenance_work_mem=64MB
          envFrom:
            - secretRef:
                name: tracearr-secret
          env:
            - name: POSTGRES_USER
              value: tracearr
            - name: POSTGRES_PASSWORD
              value: "$(DB_PASSWORD)"
            - name: POSTGRES_DB
              value: tracearr
          ports:
            - containerPort: 5432
              protocol: TCP
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /home/postgres/pgdata/data
              subPath: postgres
            - name: dshm
              mountPath: /dev/shm
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - tracearr
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - tracearr
            initialDelaySeconds: 15
            periodSeconds: 10

        - name: redis
          image: redis:8-alpine
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          command:
            - redis-server
          args:
            - --appendonly
            - "yes"
            - --maxmemory
            - 128mb
            - --maxmemory-policy
            - noeviction  # Required by BullMQ to prevent job queue corruption
            - --tcp-keepalive
            - "300"
            - --save
            - ""  # AOF only, no RDB writes
          ports:
            - containerPort: 6379
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /data
              subPath: redis

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
