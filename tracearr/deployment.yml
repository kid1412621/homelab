apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app: tracearr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tracearr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: tracearr
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: tracearr
          image: ghcr.io/connorgallopo/tracearr:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: tracearr-secret
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOST
              value: 0.0.0.0
            - name: TZ
              value: Asia/Chongqing
            - name: DATABASE_URL
              value: "postgres://tracearr:$(DB_PASSWORD)@localhost:5432/tracearr"
            - name: REDIS_URL
              value: "redis://localhost:6379"
            - name: CORS_ORIGIN
              value: "*"
            - name: LOG_LEVEL
              value: info
          ports:
            - containerPort: 3000
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data/backup
              subPath: backups

        - name: timescale
          image: timescale/timescaledb-ha:pg18.1-ts2.25.0
          args:
            - postgres
            - -c
            - timescaledb.license=timescale
            - -c
            - timescaledb.max_tuples_decompressed_per_dml_transaction=0
            - -c
            - max_locks_per_transaction=4096
            - -c
            - timescaledb.telemetry_level=off
          envFrom:
            - secretRef:
                name: tracearr-secret
          env:
            - name: POSTGRES_USER
              value: tracearr
            - name: POSTGRES_PASSWORD
              value: "$(DB_PASSWORD)"
            - name: POSTGRES_DB
              value: tracearr
          ports:
            - containerPort: 5432
              protocol: TCP
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /home/postgres/pgdata/data
              subPath: postgres
            - name: dshm
              mountPath: /dev/shm
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - tracearr
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - tracearr
            initialDelaySeconds: 15
            periodSeconds: 10

        - name: redis
          image: redis:8-alpine
          command:
            - redis-server
          args:
            - --appendonly
            - "yes"
          ports:
            - containerPort: 6379
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
              subPath: redis

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
