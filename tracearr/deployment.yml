apiVersion: apps/v1
kind: Deployment
metadata:
  name: timescale
  labels:
    app: timescale
spec:
  replicas: 1
  selector:
    matchLabels:
      app: timescale
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: timescale
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: timescale
          image: timescale/timescaledb-ha:pg18.1-ts2.25.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          args:
            - postgres
            - -c
            - timescaledb.license=timescale
            - -c
            - timescaledb.max_tuples_decompressed_per_dml_transaction=0
            - -c
            - max_locks_per_transaction=4096
            - -c
            - timescaledb.telemetry_level=off
            # Memory tuning for local lab environments
            - -c
            - shared_buffers=128MB
            - -c
            - work_mem=16MB
            - -c
            - maintenance_work_mem=64MB
          envFrom:
            - secretRef:
                name: tracearr-secret
          env:
            - name: POSTGRES_USER
              value: tracearr
            - name: POSTGRES_PASSWORD
              value: "$(DB_PASSWORD)"
            - name: POSTGRES_DB
              value: tracearr
          ports:
            - containerPort: 5432
              protocol: TCP
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: timescale-data
              mountPath: /home/postgres/pgdata/data
            - name: dshm
              mountPath: /dev/shm
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - tracearr
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - tracearr
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: timescale-data
          persistentVolumeClaim:
            claimName: timescale-data
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: redis
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        runAsNonRoot: true
      containers:
        - name: redis
          image: redis:8-alpine
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          command:
            - redis-server
          args:
            - --appendonly
            - "yes"
            - --maxmemory
            - 128mb
            - --maxmemory-policy
            - noeviction  # Required by BullMQ to prevent job queue corruption
            - --tcp-keepalive
            - "300"
            - --save
            - ""  # AOF only, no RDB writes
          ports:
            - containerPort: 6379
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app: tracearr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tracearr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: tracearr
    spec:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        runAsNonRoot: true
      initContainers:
        - name: wait-db
          image: busybox:1.37
          command: ["sh", "-c", "i=0; until nc -z timescale 5432; do i=$((i+1)); [ $i -ge 60 ] && exit 1; sleep 2; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
        - name: wait-redis
          image: busybox:1.37
          command: ["sh", "-c", "i=0; until nc -z redis 6379; do i=$((i+1)); [ $i -ge 60 ] && exit 1; sleep 2; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: tracearr
          image: ghcr.io/connorgallopo/tracearr:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          envFrom:
            - secretRef:
                name: tracearr-secret
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOST
              value: 0.0.0.0
            - name: TZ
              value: Asia/Chongqing
            - name: DATABASE_URL
              value: "postgres://tracearr:$(DB_PASSWORD)@timescale:5432/tracearr"
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: CORS_ORIGIN
              value: "*"
            - name: LOG_LEVEL
              value: info
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tracearr-backups
              mountPath: /data/backup
            - name: tracearr-image-cache
              mountPath: /app/data/image-cache
      volumes:
        - name: tracearr-backups
          persistentVolumeClaim:
            claimName: tracearr-backups
        - name: tracearr-image-cache
          persistentVolumeClaim:
            claimName: tracearr-image-cache
