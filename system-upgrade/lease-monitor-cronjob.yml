apiVersion: batch/v1
kind: CronJob
metadata:
  name: k3s-lease-monitor
  namespace: kube-system
spec:
  # Run every 50 minutes
  schedule: "*/50 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: k3s-lease-monitor
          containers:
            - name: monitor
              image: bitnami/kubectl:latest
              command:
                - /bin/sh
                - -c
                - |
                  # Count leases in cluster (more reliable than direct DB access)
                  LEASE_COUNT=$(kubectl get leases -A -o json | jq '.items | length')
                  THRESHOLD=50

                  if [ "$LEASE_COUNT" -gt "$THRESHOLD" ]; then
                    echo "WARNING: Lease count ($LEASE_COUNT) exceeds threshold ($THRESHOLD)"
                    kubectl get leases -A --sort-by=.metadata.creationTimestamp
                    exit 1
                  fi
                  echo "OK: Lease count ($LEASE_COUNT) is healthy"
          restartPolicy: OnFailure
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 3
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k3s-lease-monitor
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k3s-lease-monitor
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k3s-lease-monitor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k3s-lease-monitor
subjects:
  - kind: ServiceAccount
    name: k3s-lease-monitor
    namespace: kube-system
