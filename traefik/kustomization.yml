apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yml
  - helmchartconfig.yml
  - basic-auth-middleware.yml
  - gateway.yml
  - ../base

secretGenerator:
  - name: traefik-basic-auth
    namespace: traefik
    type: Opaque
    envs:
      - .env
    options:
      disableNameSuffixHash: true

configMapGenerator:
  - name: app-config
    literals:
      - APP_SUBDOMAIN=traefik
      - APP_PORT=8080
      - LAN_HOST=app-name.lan-domain
      - WAN_HOST=app-name.wan-domain

patches:
  - path: dashboard-httproute.yml
    target:
      kind: HTTPRoute
      name: http-route
  - target:
      kind: HTTPRoute
      name: http-route
    patch: |-
      - op: add
        path: /metadata/namespace
        value: traefik


replacements:
  - source:
      kind: ConfigMap
      name: app-config
      fieldPath: data.APP_SUBDOMAIN
    targets:
      - select:
          kind: ConfigMap
          name: app-config
        fieldPaths:
          - data.LAN_HOST
          - data.WAN_HOST
        options:
          delimiter: "."
          index: 0
  - source:
      kind: ConfigMap
      name: domain-config
      fieldPath: data.LAN_DOMAIN
    targets:
      - select:
          kind: ConfigMap
          name: app-config
        fieldPaths:
          - data.LAN_HOST
        options:
          delimiter: "."
          index: 1
  - source:
      kind: ConfigMap
      name: domain-config
      fieldPath: data.WAN_DOMAIN
    targets:
      - select:
          kind: ConfigMap
          name: app-config
        fieldPaths:
          - data.WAN_HOST
        options:
          delimiter: "."
          index: 1
  - source:
      kind: ConfigMap
      name: app-config
      fieldPath: data.LAN_HOST
    targets:
      - select:
          kind: HTTPRoute
          name: http-route
        fieldPaths:
          - spec.hostnames.0
  - source:
      kind: ConfigMap
      name: app-config
      fieldPath: data.WAN_HOST
    targets:
      - select:
          kind: HTTPRoute
          name: http-route
        fieldPaths:
          - spec.hostnames.1
  - source:
      kind: ConfigMap
      name: app-config
      fieldPath: data.APP_PORT
    targets:
      - select:
          kind: HTTPRoute
          name: http-route
        fieldPaths:
          - spec.rules.0.backendRefs.0.port
