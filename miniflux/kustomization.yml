apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: miniflux

resources:
  - namespace.yml
  - pvc.yml
  - deployment.yml
  - service.yml
  - ../base

secretGenerator:
  - name: postgres-secret
    envs:
      - .env
  - name: miniflux-secret
    envs:
      - .env

configMapGenerator:
  - name: app-config
    literals:
      - APP_SUBDOMAIN=rss
      - LAN_HOST=app-name.lan-domain
      - WAN_HOST=app-name.wan-domain
  - name: nextflux-app-config
    literals:
      - APP_SUBDOMAIN=flux
      - LAN_HOST=app-name.lan-domain
      - WAN_HOST=app-name.wan-domain

replacements:
  - source:
      kind: ConfigMap
      name: app-config
      fieldPath: data.APP_SUBDOMAIN
    targets:
      - select:
          kind: ConfigMap
          name: app-config
        fieldPaths:
          - data.LAN_HOST
          - data.WAN_HOST
        options:
          delimiter: "."
          index: 0
  - source:
      kind: ConfigMap
      name: nextflux-app-config
      fieldPath: data.APP_SUBDOMAIN
    targets:
      - select:
          kind: ConfigMap
          name: nextflux-app-config
        fieldPaths:
          - data.LAN_HOST
          - data.WAN_HOST
        options:
          delimiter: "."
          index: 0
  - source:
      kind: ConfigMap
      name: domain-config
      fieldPath: data.LAN_DOMAIN
    targets:
      - select:
          kind: ConfigMap
          name: app-config
        fieldPaths:
          - data.LAN_HOST
        options:
          delimiter: "."
          index: 1
      - select:
          kind: ConfigMap
          name: nextflux-app-config
        fieldPaths:
          - data.LAN_HOST
        options:
          delimiter: "."
          index: 1
  - source:
      kind: ConfigMap
      name: domain-config
      fieldPath: data.WAN_DOMAIN
    targets:
      - select:
          kind: ConfigMap
          name: app-config
        fieldPaths:
          - data.WAN_HOST
        options:
          delimiter: "."
          index: 1
      - select:
          kind: ConfigMap
          name: nextflux-app-config
        fieldPaths:
          - data.WAN_HOST
        options:
          delimiter: "."
          index: 1
  - source:
      kind: ConfigMap
      name: app-config
      fieldPath: data.LAN_HOST
    targets:
      - select:
          kind: IngressRoute
          name: ingress-route
        fieldPaths:
          - spec.routes.0.match
        options:
          delimiter: "`"
          index: 1
  - source:
      kind: ConfigMap
      name: app-config
      fieldPath: data.WAN_HOST
    targets:
      - select:
          kind: IngressRoute
          name: ingress-route
        fieldPaths:
          - spec.routes.1.match
        options:
          delimiter: "`"
          index: 1
  - source:
      kind: ConfigMap
      name: nextflux-app-config
      fieldPath: data.LAN_HOST
    targets:
      - select:
          kind: IngressRoute
          name: ingress-route
        fieldPaths:
          - spec.routes.2.match
        options:
          delimiter: "`"
          index: 1
  - source:
      kind: ConfigMap
      name: nextflux-app-config
      fieldPath: data.WAN_HOST
    targets:
      - select:
          kind: IngressRoute
          name: ingress-route
        fieldPaths:
          - spec.routes.3.match
        options:
          delimiter: "`"
          index: 1

patches:
  - target:
      kind: IngressRoute
      name: ingress-route
    patch: |-
      - op: replace
        path: /spec/routes/0/services/0/port
        value: 80
      - op: replace
        path: /spec/routes/1/services/0/port
        value: 80
      - op: add
        path: /spec/routes/-
        value:
          match: Host(`dummy-nextflux-lan`)
          kind: Rule
          services:
            - name: service
              port: 8300
      - op: add
        path: /spec/routes/-
        value:
          match: Host(`dummy-nextflux-wan`)
          kind: Rule
          services:
            - name: service
              port: 8300

labels:
  - includeSelectors: true
    pairs:
      app: miniflux
      app.kubernetes.io/managed-by: kustomize
